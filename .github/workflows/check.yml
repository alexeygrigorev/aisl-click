name: Check redirector

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, contabo]
    steps:
      - uses: actions/checkout@v7
      # GitHub-hosted images ship Rust; the self-hosted runner does not.
      - uses: dtolnay/rust-toolchain@stable
      - name: Test redirect responses
        working-directory: redirector
        run: cargo test --locked
